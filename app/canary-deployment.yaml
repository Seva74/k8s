apiVersion: apps/v1
kind: Deployment

metadata:
  name: orders-api-canary
  namespace: orderflow
  labels:
    app.kubernetes.io/name: orders-api-canary

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api-canary

  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api-canary

    spec:
      containers:
        - name: orders-api
          image: orderflow-api:v3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: APP_VERSION
              value: "0.2.0-canary"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
