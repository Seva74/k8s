apiVersion: apps/v1
kind: Deployment

metadata:
  name: orders-api
  namespace: orderflow
  labels:
    app.kubernetes.io/name: orders-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api

    spec:
      containers:
        - name: orders-api
          image: orderflow-api:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: APP_VERSION
              value: "0.1.0"
