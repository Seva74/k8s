apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: orderflow-gateway
  namespace: orderflow

spec:
  gatewayClassName: envoy

  listeners:
    - name: http
      hostname: orders.example.local
      protocol: HTTP
      port: 80

      allowedRoutes:
        namespaces:
          from: Same

    - name: https
      hostname: orders.example.local
      protocol: HTTPS
      port: 443

      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: orders-example-tls

      allowedRoutes:
        namespaces:
          from: Same
