apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: orders-canary-route
  namespace: orderflow

spec:
  parentRefs:
    - name: orderflow-gateway
      sectionName: http

    - name: orderflow-gateway
      sectionName: https

  hostnames:
    - orders.example.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /canary

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

      backendRefs:
        - group: ""
          kind: Service
          name: orders-api
          port: 80
          weight: 90

        - group: ""
          kind: Service
          name: orders-api-canary
          port: 80
          weight: 10
