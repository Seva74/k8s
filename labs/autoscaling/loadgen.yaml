apiVersion: v1
kind: Namespace
metadata:
  name: orderflow-load
---
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: orderflow-load

spec:
  restartPolicy: Always

  containers:
    - name: load-generator
      image: orderflow-api:v3
      imagePullPolicy: IfNotPresent

      command: ["python", "-u", "-c"]
      args:
        - |
          import concurrent.futures
          import time
          import urllib.request

          URL = (
              "http://orders-api.orderflow.svc.cluster.local"
              "/work?duration=0.5"
          )

          def send_request(number):
              try:
                  with urllib.request.urlopen(URL, timeout=10) as response:
                      response.read()
                      return response.status
              except Exception as error:
                  print(f"Request {number} failed: {error}", flush=True)
                  return None

          print("Load generator started", flush=True)

          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as pool:
              while True:
                  results = list(pool.map(send_request, range(20)))

                  successful = sum(
                      1 for result in results if result == 200
                  )

                  print(
                      f"Successful requests: {successful}/20",
                      flush=True
                  )

                  time.sleep(0.1)

      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "300m"
          memory: "128Mi"
