apiVersion: v1
kind: Pod
metadata:
  name: cpu-lab
  namespace: orderflow-lab
  labels:
    app: cpu-lab

spec:
  restartPolicy: Always

  containers:
    - name: cpu-burner
      image: orderflow-api:v2
      imagePullPolicy: IfNotPresent

      command: ["python", "-u", "-c"]
      args:
        - |
          import time

          value = 1
          last_log = time.monotonic()

          print("CPU stress started", flush=True)

          while True:
              value = (value * 1103515245 + 12345) % 2147483648

              now = time.monotonic()

              if now - last_log >= 10:
                  print("CPU stress is running", flush=True)
                  last_log = now

      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
