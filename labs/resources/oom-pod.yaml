apiVersion: v1
kind: Pod
metadata:
  name: oom-lab
  namespace: orderflow-lab
  labels:
    app: oom-lab

spec:
  restartPolicy: Always

  containers:
    - name: memory-eater
      image: orderflow-api:v2
      imagePullPolicy: IfNotPresent

      command: ["python", "-u", "-c"]
      args:
        - |
          import time

          chunks = []

          print("Starting memory stress test", flush=True)

          for step in range(1, 30):
              chunk = bytearray(16 * 1024 * 1024)

              for offset in range(0, len(chunk), 4096):
                  chunk[offset] = 1

              chunks.append(chunk)

              print(
                  f"Allocated approximately {step * 16} MiB",
                  flush=True
              )

              time.sleep(1)

          print("Allocation completed", flush=True)
          time.sleep(3600)

      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
